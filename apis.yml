aid: goodwin
name: Goodwin
description: >-
  Goodwin (Goodwin Company, teamgoodwin.com) is a B2B charter aviation technology
  company founded in 2023 and headquartered in Columbus, Ohio, backed by Canaan
  Partners at Series A. Its API-first platform serves the private-jet charter
  broker-operator ecosystem with aircraft sourcing across an 11,000+ aircraft
  database, automated proposal generation, modern payment processing beyond wire
  transfers, real-time market-adaptive pricing, and post-sale trip management. The
  white-labeled software integrates with operators' existing scheduling systems
  and is offered to emerging, growing, and enterprise brokers as well as charter
  operators. Goodwin operates purely B2B and does not currently publish a public
  developer API, OpenAPI specification, or developer portal; this profile captures
  its identity and public web properties.
